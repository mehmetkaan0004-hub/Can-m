<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sana Bir Şans Daha 💛</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#5a3e46;--p:#ff7e9d;--o:#ffb36b;--l:#c9a7ff}
*{box-sizing:border-box;margin:0}
body{font-family:Nunito,sans-serif;color:var(--ink);background:linear-gradient(180deg,#fff6f0,#ffe6ef 50%,#f1e8ff);padding-bottom:140px;overflow-x:hidden}
nav{position:sticky;top:0;z-index:5;display:flex;justify-content:center;gap:22px;padding:14px;background:#fff8;backdrop-filter:blur(10px)}
nav a{color:var(--ink);text-decoration:none;font-weight:700}
section{max-width:900px;margin:auto;padding:60px 20px;text-align:center}
h1,h2{font-family:Pacifico,cursive;font-weight:400;color:var(--p)}
h1{font-size:clamp(38px,9vw,70px)}h2{font-size:34px;margin-bottom:24px}
.sub{font-size:22px;margin-top:10px}
.card{background:#fffc;border-radius:24px;padding:28px;box-shadow:0 10px 30px #ff7e9d30;line-height:1.8;font-size:18px}
.reasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:18px}
.reasons div{background:linear-gradient(135deg,#ffe0ea,#fff0d9);padding:18px;border-radius:18px}
.grid{columns:3 200px;gap:14px}
.grid figure{break-inside:avoid;margin-bottom:14px;background:#fff;padding:8px 8px 12px;border-radius:14px;box-shadow:0 6px 18px #0002;transition:.3s}
.grid figure:nth-child(odd){transform:rotate(-1.5deg)}.grid figure:nth-child(even){transform:rotate(1.5deg)}
.grid figure:hover{transform:scale(1.04) rotate(0)}
.grid img{width:100%;display:block;border-radius:8px}
figcaption{margin-top:8px;font-size:15px}
.btns{display:flex;gap:16px;justify-content:center;margin-top:24px;flex-wrap:wrap;min-height:60px}
button{font:700 18px Nunito;border:0;border-radius:30px;padding:14px 30px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--p),var(--o))}
button.alt{background:linear-gradient(135deg,var(--l),#8ec5fc)}
.heart{position:fixed;top:100vh;z-index:0;pointer-events:none;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(40deg);opacity:0}}
#player{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;align-items:center;gap:16px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:#fffe;backdrop-filter:blur(14px);box-shadow:0 -6px 24px #ff7e9d30}
.vinyl{width:84px;height:84px;flex:none;border-radius:50%;background:repeating-radial-gradient(#111 0 2px,#222 3px 4px);display:grid;place-items:center;box-shadow:0 4px 14px #0006;animation:spin 4s linear infinite;animation-play-state:paused}
.vinyl.on{animation-play-state:running}
.vinyl i{width:34px;height:34px;border-radius:50%;background:#ddd center/cover;border:3px solid #fff}
@keyframes spin{to{transform:rotate(360deg)}}
#info{flex:1;min-width:0}#ttl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{width:100%;accent-color:var(--p)}
#player button{padding:8px 14px;font-size:18px}
</style></head><body>
<nav><a href="#top">Mektup</a><a href="#sebep">Sebepler</a><a href="#album">Albüm 📸</a><a href="#soru">Soru 💌</a></nav>
<section id="top"><h1 id="t"></h1><p class="sub" id="s"></p><br><div class="card" id="l"></div></section>
<section id="sebep"><h2>Seni Sevmemin Sebepleri</h2><div class="reasons" id="r"></div></section>
<section id="album"><h2>Anılarımız</h2><div class="grid" id="g"></div></section>
<section id="soru"><h2>Küçük Bir Soru</h2><div class="card" id="q"></div>
<div class="btns"><button id="yes">Evet, barışalım 💞</button><button class="alt" id="no">Düşüneyim 🤔</button></div></section>
<div id="player"><div class="vinyl" id="v"><i id="cv"></i></div>
<div id="info"><div id="ttl">Henüz şarkı yok 🎵</div><input id="bar" type="range" min="0" max="100" value="0"></div>
<button id="pv">⏮</button><button id="pp">▶</button><button id="nx">⏭</button></div>
<script>
if(location.search.includes('admin'))location.replace('/admin');
const $=s=>document.querySelector(s);
const ph=(t,i)=>{const c=[['#ff9a9e','#fad0c4'],['#a1c4fd','#c2e9fb'],['#ffecd2','#fcb69f'],['#e0c3fc','#8ec5fc'],['#fbc2eb','#a6c1ee'],['#fdcbf1','#e6dee9']][i%6];
return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient></defs><rect width="400" height="500" fill="url(#g)"/><text x="200" y="250" font-size="70" text-anchor="middle">💗</text><text x="200" y="310" font-size="22" text-anchor="middle" fill="#fff">${t}</text></svg>`)};
const audio=new Audio();let D,S=[],i=0;
function hearts(n=25){for(let k=0;k<n;k++){const h=document.createElement('div');h.className='heart';h.textContent=['💗','💛','💕','🌸','✨'][k%5];
h.style.cssText+=`left:${Math.random()*100}vw;font-size:${16+Math.random()*26}px;animation-duration:${5+Math.random()*6}s;animation-delay:${Math.random()*3}s`;
document.body.appendChild(h);setTimeout(()=>h.remove(),13000)}}
async function init(){
 let d=null;
 if(location.search.includes('preview'))try{d=JSON.parse(localStorage.getItem('draft'))}catch(e){}
 D=d||await (await fetch('data.json?'+Date.now())).json();
 $('#t').textContent=D.title;$('#s').textContent=D.sub;
 $('#l').innerHTML=D.letter.split('\n').map(p=>`<p>${p.replace(/</g,'&lt;')}</p>`).join('');
 $('#q').textContent=D.question;
 $('#r').innerHTML=D.reasons.map(x=>`<div>💛 ${x.replace(/</g,'&lt;')}</div>`).join('');
 $('#g').innerHTML=D.photos.map((p,k)=>`<figure><img loading="lazy" src="${p.src||ph('Fotoğraf '+(k+1),k)}"><figcaption>${(p.cap||'').replace(/</g,'&lt;')}</figcaption></figure>`).join('');
 S=D.songs;if(S.length)load(0);hearts();setInterval(()=>hearts(6),6000);
}
function load(n){i=(n+S.length)%S.length;const s=S[i];audio.src=s.src;$('#ttl').textContent='🎵 '+s.title;
 $('#cv').style.backgroundImage=`url("${s.cover||ph('',i)}")`}
function play(){if(!S.length)return;audio.play().then(()=>{$('#pp').textContent='⏸';$('#v').classList.add('on')}).catch(()=>{})}
function pause(){audio.pause();$('#pp').textContent='▶';$('#v').classList.remove('on')}
$('#pp').onclick=()=>audio.paused?play():pause();
$('#nx').onclick=()=>{if(S.length){load(i+1);play()}};
$('#pv').onclick=()=>{if(S.length){load(i-1);play()}};
audio.onended=()=>{S.length>1?(load(i+1),play()):(audio.currentTime=0,play())};
audio.ontimeupdate=()=>{$('#bar').value=audio.duration?audio.currentTime/audio.duration*100:0};
$('#bar').oninput=e=>{if(audio.duration)audio.currentTime=e.target.value/100*audio.duration};
document.addEventListener('click',()=>{if(audio.paused&&!window._m){window._m=1;play()}},{once:true});
$('#yes').onclick=()=>{hearts(80);$('#q').innerHTML='<b style="font-size:24px">Teşekkür ederim 💖 Seni çok seviyorum!</b>'};
$('#no').onmouseover=$('#no').ontouchstart=e=>{const b=e.target;b.style.transform=`translate(${(Math.random()-.5)*160}px,${(Math.random()-.5)*60}px)`};
init();
</script></body></html>
